<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    background: #fdfcfb;
    color: #62595a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 80px 100px;
    position: relative;
  }
  .accent-top {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 8px;
    background: #fd9227;
  }
  .accent-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: #62595a;
  }
  .brand {
    font-size: 32px;
    font-weight: 500;
    letter-spacing: 0.28em;
    color: #62595a;
    margin-bottom: 8px;
  }
  .brand-jp {
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.35em;
    color: #9a8f8d;
    margin-bottom: 56px;
  }
  .catch {
    font-size: 56px;
    font-weight: 700;
    color: #2a2525;
    letter-spacing: 0.04em;
    line-height: 1.5;
    text-align: center;
    margin-bottom: 40px;
  }
  .divider {
    width: 80px;
    height: 2px;
    background: #fd9227;
    margin-bottom: 36px;
  }
  .tagline {
    font-size: 22px;
    color: #62595a;
    letter-spacing: 0.08em;
    line-height: 1.7;
    text-align: center;
  }
  .tagline b {
    color: #fd9227;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="accent-top"></div>
  <div class="brand">STYLE OF TOKYO</div>
  <div class="brand-jp">スタイルオブ東京</div>
  <div class="catch">不動産のことなら、<br>何でもご相談ください。</div>
  <div class="divider"></div>
  <div class="tagline">
    東京の不動産エージェント<br>
    購入・売却・住み替え・相続・家じまい・建築 ── <b>Zoom 無料相談受付中</b>
  </div>
  <div class="accent-bottom"></div>
</body>
</html>
