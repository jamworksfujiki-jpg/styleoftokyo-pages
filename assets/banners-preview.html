<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>3バナー並べたプレビュー（税理士提携の下に CONCEPT / PARTNERS）</title>
<style>
body {
  margin: 0;
  padding: 40px 20px;
  font-family: 'Noto Sans JP', sans-serif;
  background: #f7f7f7;
}
.preview-frame {
  max-width: 1480px;
  margin: 0 auto;
  background: #ffffff;
  padding: 40px 20px;
  border-radius: 4px;
}
.preview-label {
  text-align: center;
  font-size: 13px;
  color: #888;
  margin-bottom: 32px;
  letter-spacing: 0.1em;
}
.banner-stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.banner-stack a {
  display: block;
  text-decoration: none;
}
.banner-stack img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 6px;
}
.note {
  margin-top: 40px;
  padding: 20px;
  background: #fffbf3;
  border-left: 3px solid #fd9227;
  font-size: 13px;
  line-height: 1.8;
  color: #62595a;
}
</style>
</head>
<body>
<div class="preview-frame">
  <div class="preview-label">— トップページ末尾のイメージ（税理士提携の下にCONCEPT/PARTNERSが並ぶ） —</div>
  <div class="banner-stack">
    <a href="https://styleoftokyo.jp/zeirishi-recruit/">
      <img src="zeirishi-banner.png" alt="提携会計事務所募集 - 前倒し相続パートナーシップ">
    </a>
    <a href="https://styleoftokyo.jp/concept/">
      <img src="concept-banner.png" alt="スタイルオブ東京とは">
    </a>
    <a href="https://styleoftokyo.jp/partners/">
      <img src="partners-banner.png" alt="住宅会社からのご紹介の方へ">
    </a>
  </div>
  <div class="note">
    <strong>このプレビューについて</strong><br>
    実際の styleoftokyo.jp トップでは、SWELLテーマの背景（薄グレー#f7f7f7）に同じ間隔で3枚が並ぶイメージです。<br>
    色のバランスを意識して：<br>
    ・税理士提携＝ライト緑（既存）<br>
    ・スタイルオブ東京とは＝ダーク緑（深い哲学的トーン）<br>
    ・住宅会社からのご紹介＝ダーク茶（土・木材を連想する温かみ）<br>
    と差別化しています。
  </div>
</div>
</body>
</html>
